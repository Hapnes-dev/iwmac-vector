name: Update VectorCraft

# Run by hand: replaces app/ with the official web build of another VectorCraft release,
# unpacked and unmodified, and commits it. Pages then serves the new version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.10.0"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the web build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" -R storytold/vectorcraft -p "vectorcraft-web-${VERSION}.zip" -D /tmp/vc
          rm -rf /tmp/vc/out && mkdir -p /tmp/vc/out
          unzip -q "/tmp/vc/vectorcraft-web-${VERSION}.zip" -d /tmp/vc/out
          SRC="/tmp/vc/out/vectorcraft-web-${VERSION}"
          test -f "$SRC/index.html"
          rm -rf app && mkdir app && cp -r "$SRC/." app/
          sed -i "s/VectorCraft [0-9][0-9.]*/VectorCraft ${VERSION}/" index.html
          sed -i -E "s/(vectorcraft-web-|releases\/tag\/v|\[v)[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/g" README.md
      - name: Commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app index.html README.md
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "VectorCraft ${TAG}: official web build, unmodified"
          git push
