<script type="module">
import init, * as bindings from './vectorcraft-web-71a4571a94e1b9a.js';
// iwmac-vector: the wasm ships gzipped (GitHub refuses a file over 100 MiB; build/compress-wasm.py). It is unpacked
// as it downloads (unless the server already did: then it does not start 1f 8b) and compiled meanwhile, and only
// once its SHA-384 is the one this page was built with does init instantiate and start it.
const wasm = await init({ module_or_path: await (async () => {
  const res = await fetch('./vectorcraft-web-71a4571a94e1b9a_bg.wasm.gz');
  if (!res.ok) throw new Error('vectorcraft-web-71a4571a94e1b9a_bg.wasm.gz: HTTP ' + res.status);
  const reader = res.body.getReader(), first = await reader.read(), head = first.value || new Uint8Array(0);
  let body = new ReadableStream({
    start(c) { if (!first.done) c.enqueue(head); else c.close(); },
    async pull(c) { const r = await reader.read(); if (r.done) c.close(); else c.enqueue(r.value); },
  });
  if (head[0] === 0x1f && head[1] === 0x8b) body = body.pipeThrough(new DecompressionStream('gzip'));
  const [toCompile, toCheck] = body.tee();
  const compiled = WebAssembly.compileStreaming(new Response(toCompile, { headers: { 'Content-Type': 'application/wasm' } }));
  const bytes = await new Response(toCheck).arrayBuffer();
  const sum = 'sha384-' + btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-384', bytes))));
  if (sum !== 'sha384-6rEYl/CTryPsRQfw3n4fDSbg+Mk/kpOLaTd6J/iQrE4eHRPkPpiywUWI8WASfcRg') throw new Error('vectorcraft-web-71a4571a94e1b9a_bg.wasm: not the wasm this page was built with');
  return await compiled;
})() });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
